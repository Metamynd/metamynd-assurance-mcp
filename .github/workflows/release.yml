name: release

# Publishes @metamynd/assurance-mcp to npm when a version tag (vX.Y.Z) is pushed.
#
# Authentication, in order:
#   1. npm trusted publishing (OIDC): no stored token, provenance attached automatically. Set it up once on npmjs.com:
#      @metamynd/assurance-mcp > Settings > Trusted publishing: GitHub Actions, organization "Metamynd", repository
#      "metamynd-assurance-mcp", workflow "release.yml", environment "npm". npm only allows this once the package exists,
#      so the FIRST release uses (2).
#   2. NPM_TOKEN (or NPM) repository secret: a granular token with "Bypass 2FA" and the @metamynd scope, used only while
#      the secret exists. Delete the secret once trusted publishing is set up.
#
# Before publishing: the tag must equal package.json's version, and typecheck + tests must pass on the exact commit.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    env:
      HAS_TOKEN: ${{ (secrets.NPM_TOKEN || secrets.NPM) != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.20.0

      - name: The tag is the package's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          [ "$TAG" = "$VERSION" ] || { echo "::error::tag v$TAG does not match package.json version $VERSION"; exit 1; }
          [ "$NAME" = "@metamynd/assurance-mcp" ] || { echo "::error::unexpected package name $NAME"; exit 1; }
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "::error::$NAME@$VERSION is already on npm"; exit 1; fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: What will be published
        run: npm pack --dry-run 2>&1 | tee pack.txt && ! grep -E 'test/|\.github/|\.env' pack.txt

      - name: Publish (npm token, first release only)
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM }}
        run: npm publish --access public --provenance

      - name: Publish (trusted publishing)
        if: ${{ env.HAS_TOKEN != 'true' }}
        run: npm publish --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "@metamynd/assurance-mcp ${GITHUB_REF_NAME#v} on npm - https://www.npmjs.com/package/@metamynd/assurance-mcp"